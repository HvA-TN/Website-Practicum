site_name: Practica Technische Natuurkunde – Jaar 2
site_url: https://hva-tn.github.io/Practica_LJ2/

theme:
  name: material
  language: nl
  highlightjs: true

  features:
  - navigation.sections
  - navigation.indexes
  - navigation.tracking
  - navigation.top
  - toc.follow
  - content.code.copy
  - content.code.annotate
  - content.footnote.tooltips
  palette:

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Gebruik donkere modus

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Gebruik lichte modus

nav:
  - Home: index.md
  - Regels Practicum: regels.md
  - Voorbereiding, digitaal labjournaal & afronding practicum: voorbereiding.md
  - Fraude & gebruik van AI: fraude.md
  - Veiligheid: veiligheid.md
  - Meetplan: meetplan.md
  - Python-tips: Python_tips.md
  - Periode 1:
      - Overzicht: periode 1/index.md
      - Python: periode 1/python.md
      - Lenzen: periode 1/lenzen.md
      - Spectrometer: periode 1/spectrometer.md
  # - Periode 2:
  #     - Overzicht: periode 2/index.md
  #     - Aeropendulum (open-loop): periode 2/aeropendulum-openloop.md
  #     - Aeropendulum (PID): periode 2/aeropendulum-pid.md
  #     - Zonnecel: periode 2/zonnecel.md
  # - Periode 3:
  #     - Overzicht: Periode 3/index.md
  #     - SEM-EDX: Periode 3/semedx.md
  #     - Elektronenbundel (e/m): Periode 3/elektronen-em.md
  #     - Elektronendiffractie: Periode 3/elektronendiffractie.md
  #     - Apparaatcommunicatie met Python: Periode 3/apparaatcommunicatie.md
  # - Periode 4:
  #     - Overzicht: Periode 4/index.md
  #     - Trekbankproef I: Periode 4/trekbankproef-1.md
  #     - Trekbankproef II: Periode 4/trekbankproef-2.md
  #     - Hardheid en kerfslag: Periode 4/hardheid-kerfslag.md
  #     - Kinematische viscositeit: Periode 4/kinematische-viscositeit.md
  #     - Digitale viscositeit: Periode 4/digitale-viscositeit.md
  # - Aanvullend materiaal:
  #     - UV-VIS: periode 2/uvvis.md
  #     - Dieetzout en bèta-afbuiging: Periode 3/dieetzout.md

exclude_docs: |
  periode 1/planck.md


markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes

  - toc:
      toc_depth: 2

  - pymdownx.details
  - pymdownx.superfences

  - pymdownx.highlight:
      anchor_linenums: true

  - pymdownx.arithmatex:
      generic: true
      
extra_css:
  - stylesheets/practica.css
extra_javascript:
  - javascript/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js


